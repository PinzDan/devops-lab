
name: CI devops-lab

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    permissions: 
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Image name
      run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Test with Maven
      run: ./mvnw -B test

    - name: Docker Build
      run: |
        docker build \
        -t ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
        -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
        .

    - name: Docker run
      id: docker-run-step
      run: docker run --name devops-lab-app -d -p 8080:8080 ghcr.io/pinzdan/devops-la:${{ github.sha }}

    - name: Wait Application Response
      run: |
        for i in {1..30}; do
          if curl -fs http://localhost:8080/actuator/health > /dev/null; then
            echo "HealthCheck completed."
            exit 0
          else
            echo "Waiting for a reply ($i/30)..."
            sleep 2
          fi
        done
        echo "L'applicazione non si è avviata entro i tempi previsti."
        exit 1

    - name: Login to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      if: github.event_name == 'push'
      run: | 
        docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
        docker push ghcr.io/${{ env.IMAGE_NAME }}:latest

    - name: Show Docker Logs on Failure
      if: failure() && steps.docker-run-step.conclusion == 'success'
      run: |
        echo "=== LOG DEL CONTAINER ==="
        docker logs devops-lab-app
  
    - name: Cleanup container
      if: always() && steps.docker-run-step.conclusion == 'success'
      run: docker rm -f devops-lab-app
    
