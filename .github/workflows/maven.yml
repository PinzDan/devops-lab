
name: CI devops-lab

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: ghcr.io/pinzdan/devops-lab
  AWS_REGION: eu-central-1                 
  ECR_REPOSITORY: devops-labs
  IAM_ROLE_ARN: arn:aws:iam::933516006450:role/gha-ecr-push-my-api-prod

permissions:
        contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
        
      - name: Test with Maven
        run: ./mvnw -B test
      


  build:
    name: Build
    needs: [ test ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4    
      
      - name: Docker Build
        run: |
          docker build \
          -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ env.IMAGE_NAME }}:latest \
          .
      
      - name: Export Docker image
        run: |
          mkdir output &&
          docker save \
          ${{ env.IMAGE_NAME }}:${{ github.sha }} \
          ${{ env.IMAGE_NAME }}:latest \
          -o output/image.tar
          
      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: docker-image-${{ github.sha }}
          path: output/image.tar
          retention-days: 1
      
    
  run:
    name: run
    needs: [build]
    runs-on: ubuntu-latest

    steps:

      - name: Import Docker image
        uses: actions/download-artifact@v5
        with:
          name: docker-image-${{ github.sha }}
          path: output

      - name: Docker Load
        run: docker load -i output/image.tar

      - name: Extract Docker image metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/my-image
          
      - name: Docker run
        id: docker-run-step
        run: docker run --name devops-lab-app -d -p 8080:8080 ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait Application Response
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8080/actuator/health > /dev/null; then
              echo "HealthCheck completed."
              exit 0
            else
              echo "Waiting for a reply ($i/30)..."
              sleep 2
            fi
          done
          echo "L'applicazione non si è avviata entro i tempi previsti."
          exit 1

      - name: Show Docker Logs on Failure
        if: failure() && steps.docker-run-step.conclusion == 'success'
        run: |
          echo "=== LOG DEL CONTAINER ==="
          docker logs devops-lab-app
    
      - name: Cleanup container
        if: always() && steps.docker-run-step.conclusion == 'success'
        run: docker rm -f devops-lab-app
    
    
  publish-ghcr:
    name: Publish GHCR
    needs: [ run ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
        contents: read
        packages: write

    steps:

      - name: Download Docker image
        uses: actions/download-artifact@v5
        with:
          name: docker-image-${{ github.sha }}
          path: output
        
      - name: Load Docker image
        run: docker load -i output/image.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: | 
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  publish-ecr:
    name: Publish ECR
    needs: [ run ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
  
    permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read 

    steps:
  
        - name: Download Docker image
          uses: actions/download-artifact@v5
          with:
            name: docker-image-${{ github.sha }}
            path: output
          
        - name: Load Docker image
          run: docker load -i output/image.tar

        - name: Configure AWS Credentials
        
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with:
            role-to-assume: ${{env.IAM_ROLE_ARN}}
            aws-region: ${{env.AWS_REGION}}
            
        - name: Verify AWS Identity
          run: aws sts get-caller-identity

        - name: Login to ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Docker Tag & Push
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: ${{env.ECR_REPOSITORY}}
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker tag \
              ${{ env.IMAGE_NAME }}:${{ github.sha }} \
              $REGISTRY/$REPOSITORY:$IMAGE_TAG
              
            docker tag \
              ${{ env.IMAGE_NAME }}:latest \
              $REGISTRY/$REPOSITORY:latest
              
            docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
            docker push $REGISTRY/$REPOSITORY:latest          





