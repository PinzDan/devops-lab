
name: CI/CD devops-lab

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: ghcr.io/pinzdan/devops-lab
  AWS_REGION: eu-central-1                 
  ECR_REPOSITORY: devops-labs
  IAM_ROLE_ARN: arn:aws:iam::933516006450:role/gha-ecr-push-my-api-prod

permissions:
        contents: read

jobs:

  test:
    name: Maven Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
        
      - name: Test with Maven
        run: ./mvnw -B test
      


  build-check:
    name: Docker Build Check
    needs: [ test ]
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    name: Docker Build & Push
    needs: [ test ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read 
      packages: write

    steps:
      - uses: actions/checkout@v4   

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{env.IAM_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
             ${{env.IMAGE_NAME }}
             ${{steps.login-ecr.outputs.registry }}/${{env.ECR_REPOSITORY}}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true



